<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1500" viewBox="0 0 3000 1500" role="img" aria-label="Aunty Suzy">
  <defs>
    <!-- colour variable: edit to change text colour -->
    <style>
      :root { --text-fill: #6b3f21; --text-stroke: #3f2616; }
      .logo-text { font-family: Georgia, "Times New Roman", Times, serif; font-weight: 700; }
    </style>

    <!-- subtle stitched texture using turbulence + displacement -->
    <filter id="stitchTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="mask">
        <feFuncA type="table" tableValues="0 0.6 0.9"/>
      </feComponentTransfer>
      <feGaussianBlur in="mask" stdDeviation="0.8" result="softMask"/>
      <feBlend in="SourceGraphic" in2="softMask" mode="multiply"/>
    </filter>

    <!-- shadow & subtle emboss -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="offsetBlur"/>
      <feSpecularLighting in="blur" surfaceScale="2" specularConstant="0.2" specularExponent="10" lighting-color="#fff" result="spec">
        <fePointLight x="2000" y="-200" z="1000"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="litShape"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="litShape"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- background transparent; useful when embedded in sites -->
  <g fill="none">
    <!-- optional background rectangle (commented out). If you want a beige backing, uncomment -->
    <!-- <rect width="100%" height="100%" fill="#f5ead2"/> -->
  </g>

  <!-- Centering group -->
  <g transform="translate(1500,750)" text-anchor="middle">
    <!-- Slight decorative underline curve (editable) -->
    <path d="M -900 260 Q 0 420 900 260" fill="none" stroke="rgba(90,55,30,0.06)" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Main text with stroke for slightly carved look -->
    <text class="logo-text" x="0" y="-60" font-size="420" fill="var(--text-fill)" stroke="var(--text-stroke)" stroke-width="10" paint-order="stroke fill" filter="url(#emboss)">
      Aunty Suzy
    </text>

    <!-- smaller tagline line if wanted — commented out: uncomment to use -->
    <!--
    <text class="logo-text" x="0" y="120" font-size="120" fill="#8a5f3a" style="font-weight:600;">
      Authentic food, crafts & events
    </text>
    -->

    <!-- stitched texture overlay: a very subtle multiply blend -->
    <g filter="url(#stitchTexture)">
      <text class="logo-text" x="0" y="-60" font-size="420" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="3" paint-order="stroke" />
    </g>
  </g>
</svg>
