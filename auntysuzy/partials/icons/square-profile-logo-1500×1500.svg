<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1500" viewBox="0 0 1500 1500" role="img" aria-label="Aunty Suzy">
  <defs>
    <style>
      :root { --text-fill: #6b3f21; --text-stroke: #3f2616; }
      .logo-text { font-family: Georgia, "Times New Roman", Times, serif; font-weight: 700; }
    </style>

    <filter id="stitchTextureSq" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="mask">
        <feFuncA type="table" tableValues="0 0.55 0.9"/>
      </feComponentTransfer>
      <feGaussianBlur in="mask" stdDeviation="0.6" result="softMask"/>
      <feBlend in="SourceGraphic" in2="softMask" mode="multiply"/>
    </filter>

    <filter id="embossSq" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offsetBlur"/>
      <feSpecularLighting in="blur" surfaceScale="1.4" specularConstant="0.15" specularExponent="8" lighting-color="#fff" result="spec">
        <fePointLight x="800" y="-80" z="600"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="litShape"/>
      <feMerge>
        <feMergeNode in="offsetBlur"/>
        <feMergeNode in="litShape"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- optional beige background for profile images: uncomment to use -->
  <!-- <rect width="100%" height="100%" fill="#f5ead2" rx="120"/> -->

  <g transform="translate(750,760)" text-anchor="middle">
    <text class="logo-text" x="0" y="-10" font-size="260" fill="var(--text-fill)" stroke="var(--text-stroke)" stroke-width="6" paint-order="stroke fill" filter="url(#embossSq)">
      Aunty
    </text>
    <text class="logo-text" x="0" y="220" font-size="260" fill="var(--text-fill)" stroke="var(--text-stroke)" stroke-width="6" paint-order="stroke fill" filter="url(#embossSq)">
      Suzy
    </text>

    <!-- subtle texture overlay -->
    <g filter="url(#stitchTextureSq)">
      <text class="logo-text" x="0" y="-10" font-size="260" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.6" paint-order="stroke" />
      <text class="logo-text" x="0" y="220" font-size="260" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.6" paint-order="stroke" />
    </g>
  </g>
</svg>
