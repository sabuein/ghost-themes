<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" role="img" aria-label="Grace GS">
  <title>Grace GS</title>
  <!-- Colour comes from CSS via currentColor. Inline this in your nav, then set the
       SVG's CSS color to your accent token so it tracks the Ghost accent. -->
  <g fill="currentColor">
    <rect x="0"  y="0"  width="13" height="13" rx="2"/>
    <rect x="15" y="0"  width="13" height="13" rx="2"/>
    <rect x="0"  y="15" width="28" height="13" rx="2"/>
  </g>
</svg>
